  <script>
    // One 404 page serves every language: pick the reader's from the address (/fi/, /de/) or their saved choice.
    (() => {
      const words = {
        fi: { title: 'Täällä ei ole <span class="accent">mitään</span>', text: "Tätä sivua ei ole olemassa. Jos avasit linkin Fimblestä, varmista että sovellus on asennettu, ja yritä uudelleen.", home: "Takaisin etusivulle", store: "Lataa", storeName: "App Storesta", get: "Lataa sovellus", new: "Uutta", features: "Ominaisuudet", week: "Ensimmäinen viikko", ai: "Tekoäly", faq: "UKK", blog: "Blogi", doc: "Sivua ei löytynyt – Fimbl" },
        de: { title: 'Hier gibt es <span class="accent">nichts</span>', text: "Diese Seite gibt es nicht. Wenn du einen Link aus Fimbl geöffnet hast, prüfe, ob die App installiert ist, und versuch es noch einmal.", home: "Zur Startseite", store: "Laden im", storeName: "App Store", get: "App laden", new: "Neu", features: "Funktionen", week: "Erste Woche", ai: "KI", faq: "FAQ", blog: "Blog", doc: "Seite nicht gefunden – Fimbl" },
      };
      let lang = location.pathname.split("/")[1];
      if (!words[lang]) {
        try { lang = localStorage.getItem("fimbl-lang"); } catch {}
      }
      const t = words[lang];
      if (!t) return;
      const home = "/" + lang + "/";
      const blog = lang === "fi" ? "/fi/blogi/" : "/de/blog/";
      document.documentElement.lang = lang;
      document.title = t.doc;
      document.querySelectorAll("[data-t]").forEach((el) => {
        const key = el.dataset.t;
        if (key === "title") el.innerHTML = t.title;
        else if (t[key]) el.textContent = t[key];
      });
      document.querySelectorAll('a[href="/"], a[href^="/#"]').forEach((a) => a.setAttribute("href", home + a.getAttribute("href").slice(1)));
      document.querySelectorAll('a[href="/blog/"]').forEach((a) => a.setAttribute("href", blog));
    })();
  </script>
